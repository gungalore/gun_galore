<?xml version="1.0" encoding="UTF-8"?>
<!--
  ALL OUTDOOR — interim compact mark (square lockup for tight spaces).

  Geometry only, no text and no webfont dependency, so it renders identically
  everywhere including as a favicon at 16px. Replaces the previous bullet /
  cartridge silhouette.

  Swap this file when real artwork arrives. Keep it square and keep the
  important shape inside the middle 80% — Android maskable icons crop to a
  circle.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="All Outdoor">
  <title>All Outdoor</title>
  <rect width="512" height="512" rx="112" fill="#141414"/>
  <!-- Main summit -->
  <path d="M96 372 L232 128 L328 296 L368 236 L416 372 Z" fill="#C8102E"/>
  <!-- Snow cap, offset so the peak reads at small sizes -->
  <path d="M232 128 L280 214 L236 268 L188 214 Z" fill="#ffffff" opacity="0.92"/>
</svg>
