<?xml version="1.0" encoding="UTF-8"?>
<!--
  ALL OUTDOOR — interim wordmark.

  Replaces the previous mark, which was the words GUN•GALORE set inside a
  BULLET/CARTRIDGE outline: a firearm motif in the logo itself, rendered on
  every page, in the app icon and in every share unfurl. No amount of content
  gating helps while the logo is a bullet.

  Deliberately typographic and geometry-only so it renders identically without
  a webfont: the peak glyph is drawn, and the wordmark uses a system stack.
  This is a PLACEHOLDER of reasonable quality — swap this file (and
  logo-mark.svg) when real artwork arrives; nothing else needs to change.

  Sized for a dark header (white text). --red is #C8102E.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-label="All Outdoor">
  <title>All Outdoor</title>

  <!-- Peak mark: two overlapping summits. Outdoor, not tactical. -->
  <g>
    <path d="M18 118 L62 42 L92 94 L106 72 L142 118 Z" fill="#C8102E"/>
    <path d="M62 42 L78 70 L64 94 L48 70 Z" fill="#ffffff" opacity="0.92"/>
  </g>

  <text x="170" y="104"
        font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="76" font-weight="700" letter-spacing="1.5" fill="#ffffff">ALL</text>
  <text x="292" y="104"
        font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="76" font-weight="700" letter-spacing="1.5" fill="#C8102E">OUTDOOR</text>
</svg>
