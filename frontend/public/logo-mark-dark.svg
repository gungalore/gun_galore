<!--
  ALL OUTDOOR — operator-supplied logo, traced to vector 2026-08-21.

  The AO monogram: an A whose counter is a snow-capped peak, an O, and
  a red road running out of the mountain. Replaces the Table Mountain /
  kudu / bakkie scene traced on 2026-08-12.

  ⚠️ TRACED, NOT EMBEDDED. The operator supplied 1254px PNGs with the
  background baked in. A nav wordmark rendered from a raster is soft on
  a high-DPI phone and cannot be recoloured; these are real paths.

  ⚠️ TWO FILLS, AND THE RED IS NOT NEGOTIABLE. The road is the only
  colour in the mark and it stays #E01B24 on every ground. The ink layer
  is the half that changes between the light and dark variants.

  The monogram in dark ink, for light grounds: the .ico, and any  light-background surface that wants the mark without the words.
-->
