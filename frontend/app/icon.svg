<!--
  ALL OUTDOOR favicon — the AO monogram, transparent, theme-aware.

  ⚠️ THE INK FLIPS WITH THE BROWSER, and it has to. A transparent favicon is
  invisible on a tab bar the colour of its own ink: white vanishes on Chrome's
  light strip, near-black vanishes on its dark one. An .ico cannot express
  that, so favicon.ico carries the dark ink for the common light default and
  this file — which Chrome and Firefox prefer when offered — carries both.

  ⚠️ The red road is NOT themed. It is the one fixed colour in the mark.
-->
