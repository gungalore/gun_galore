# ===========================================================================
# All Outdoor — nginx site
#
# Deployed on the production VPS as:
#     /etc/nginx/sites-available/gungalore
#     /etc/nginx/sites-enabled/gungalore  -> symlink to the above
#
# This file is the committed copy of the config that runs in production.
# It was captured from the live server on 2026-08-12 and is byte-equivalent
# in behaviour; only comments have been added. If you change the server,
# change this file in the same commit — otherwise the next person rebuilding
# the box gets a subtly different site and spends a day finding out why.
#
# ---------------------------------------------------------------------------
# THE FOUR THINGS TO CHANGE WHEN YOU REUSE THIS FILE
# ---------------------------------------------------------------------------
#   1. APEX DOMAIN        gungalore.co.za
#   2. WWW DOMAIN         www.gungalore.co.za
#   3. CERT PATHS         /etc/ssl/cloudflare/gungalore.pem
#                         /etc/ssl/cloudflare/gungalore.key
#   4. UPSTREAM PORTS     127.0.0.1:3000 (Next.js) and 127.0.0.1:3001 (NestJS)
#
# nginx has no variable substitution in `server_name` or `ssl_certificate`,
# so these are literals. For the planned alloutdoor.co.za cutover the whole
# change is a search-and-replace plus a new Cloudflare Origin Certificate:
#
#     sed -i 's/gungalore\.co\.za/alloutdoor.co.za/g' /etc/nginx/sites-available/gungalore
#     nginx -t && systemctl reload nginx
#
# Do that only together with the DNS move and the Clerk FAPI domain — the
# frontend's Clerk keys are issued against clerk.gungalore.co.za.
#
# ---------------------------------------------------------------------------
# TOPOLOGY
# ---------------------------------------------------------------------------
#   client → Cloudflare (proxied, orange cloud) → nginx :443 → node upstreams
#
# Cloudflare terminates the public TLS. nginx terminates a SECOND TLS session
# using a Cloudflare Origin Certificate — a cert Cloudflare issues that only
# Cloudflare trusts. It is not publicly valid. Hitting the origin IP directly
# in a browser gives a certificate warning, and that is correct and expected.
#
# There is NO `api.gungalore.co.za` server block. Some older notes claim there
# is. The API is served from the apex under the `/api/` prefix (NestJS sets
# that prefix itself in `backend/src/main.ts` via `app.setGlobalPrefix('api')`,
# which is why the proxy_pass below keeps `/api/` on the way through).
#
# ---------------------------------------------------------------------------
# WHAT MUST NEVER BE COMMITTED
# ---------------------------------------------------------------------------
# The paths to the certificate and key are fine — they are paths. The FILES
# they point at are private keys. They live on the server, in
# /etc/ssl/cloudflare/, mode 0600 root:root, and they never enter git.
# ===========================================================================


# ---------------------------------------------------------------------------
# Cloudflare real-IP restoration
# ---------------------------------------------------------------------------
# Every request arrives at nginx from a Cloudflare edge address, so
# `$remote_addr` is Cloudflare, not the visitor. These directives tell nginx
# "if the connection came from one of these ranges, believe the
# CF-Connecting-IP header instead" — after which `$remote_addr` is the real
# client for logging, for `X-Forwarded-For`, and for anything downstream.
#
# WHY IT MATTERS MORE THAN IT LOOKS: the backend calls `app.set('trust proxy', 1)`
# (see backend/src/main.ts) and @nestjs/throttler keys its rate-limit buckets on
# `req.ip`. Express with `trust proxy = 1` takes the LAST entry of
# X-Forwarded-For, and nginx builds that header as `$proxy_add_x_forwarded_for`
# — i.e. it appends `$remote_addr`. So without this block the last entry is a
# Cloudflare edge IP, every visitor behind the same edge PoP shares one bucket,
# and the per-route limits on auth, KYC, action tokens and the paid AI
# endpoints collapse into a single global bucket. With it, the last entry is
# the visitor and the limits work per client.
#
# The ranges are Cloudflare's published origin IPs (https://cloudflare.com/ips/).
# They change rarely but they do change. If rate limiting suddenly behaves like
# everyone is one person, re-check this list first.
#
# NOTE: verified present on the production server on 2026-08-12 (22
# `set_real_ip_from` lines in /etc/nginx/sites-available/gungalore). An earlier
# internal note said production was missing this block; that note was wrong.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;


# ---------------------------------------------------------------------------
# 1. Plain HTTP → HTTPS on the apex
# ---------------------------------------------------------------------------
# In normal operation Cloudflare never sends us port 80 (the edge is set to
# Full/Strict), so this block exists for direct-to-origin traffic and for the
# window during a DNS change when the orange cloud is off. Redirecting rather
# than serving means there is no path by which the site answers in cleartext.
server {
    listen 80;
    listen [::]:80;
    server_name gungalore.co.za www.gungalore.co.za;

    return 301 https://gungalore.co.za$request_uri;
}


# ---------------------------------------------------------------------------
# 2. www → apex (HTTPS)
# ---------------------------------------------------------------------------
# The apex is canonical everywhere: sitemap.ts, the Clerk allowed origins, the
# `FRONTEND_URL` the backend CORS check compares against, and every SMS short
# link. Serving both hostnames would split SEO and break CORS for anyone who
# landed on www. It needs its own TLS block because the redirect happens AFTER
# the handshake — you cannot redirect a hostname you refuse to complete TLS for.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gungalore.co.za;

    ssl_certificate     /etc/ssl/cloudflare/gungalore.pem;
    ssl_certificate_key /etc/ssl/cloudflare/gungalore.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://gungalore.co.za$request_uri;
}


# ---------------------------------------------------------------------------
# 3. The site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gungalore.co.za;

    # Cloudflare Origin Certificate. Issued from the Cloudflare dashboard
    # (SSL/TLS → Origin Server), 15-year validity, valid ONLY for connections
    # coming from Cloudflare. Do not point certbot at this domain expecting it
    # to help; while the orange cloud is on, Let's Encrypt's HTTP-01 challenge
    # is answered by the edge, not by us.
    ssl_certificate     /etc/ssl/cloudflare/gungalore.pem;
    ssl_certificate_key /etc/ssl/cloudflare/gungalore.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Sellers photograph stock on a phone. A modern iPhone JPEG is 3–8 MB and
    # a listing takes up to five of them, plus KYC document scans and the
    # firearm-licence photos. nginx's 1 MB default rejected those with a 413
    # before the request ever reached Node. 50M is the ceiling that has to stay
    # in step with the body-parser limit in backend/src/main.ts (15 MB JSON) —
    # nginx is the outer wall, Node is the inner one. HEIC upload was reverted
    # once for exactly this reason; if you see 413s in the wild, check both.
    client_max_body_size 50M;

    # Google Search Console site-verification file (needed for the Play Console
    # developer account, added 2026-06-11). Served straight off disk so it
    # survives any frontend routing change. Delete it and the Play listing's
    # domain verification fails.
    location = /google8e0764cb4d0beea8.html {
        alias /var/www/gg-verify/google8e0764cb4d0beea8.html;
        default_type text/html;
    }

    # ── API → NestJS on :3001 ──────────────────────────────────────────────
    # The trailing `/api/` on BOTH sides is deliberate: the prefix is preserved,
    # because Nest mounts every controller under `/api` itself. Dropping it
    # here would 404 the entire backend.
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Hard-coded `https` rather than `$scheme`: nginx only ever sees this
        # request over its own TLS session, but if the port-80 block above is
        # ever loosened, `$scheme` would tell the backend "http" and Clerk's
        # session cookies would stop being marked Secure.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # 120s, not the 60s default. Listing creation runs Claude vision
        # moderation on up to five photos inline, and the admin report exports
        # stream large PDFs. Those legitimately take over a minute.
        proxy_read_timeout 120s;
    }

    # ── Long-cache static assets ───────────────────────────────────────────
    # Next.js content-hashes every file path under /_next/static/, so a changed
    # file is a changed URL and it is always safe to cache forever. A Lighthouse
    # audit flagged the absence of explicit cache headers here as the single
    # biggest cache-lifetime miss on the site.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # iOS `apple-touch-startup-image` splash JPEGs. Filenames are fixed, so
    # replacing one needs a redeploy AND a cache-busting path change.
    location /splash/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── /public brand + hero assets ────────────────────────────────────────
    # hero.webp, logo.svg, favicon.ico, og-default.jpg, the PWA icons. These
    # have STABLE filenames across deploys, so a 30-day cache is a trap unless
    # the URL carries a version — which is exactly what bit us on 2026-08-12:
    # the origin served the new brand immediately and the edge kept serving the
    # old one for another twelve hours (`cf-cache-status: HIT`, `Age: 45392`).
    # The fix lives in the app, not here: frontend/lib/asset-version.ts exports
    # `ASSET_VERSION` and `av()`. Bump ASSET_VERSION whenever you replace the
    # bytes behind an existing filename. See docs/DEPLOYMENT.md.
    #
    # 30 days rather than `immutable` is the deliberate compromise: the
    # operator can push a corrected logo and have it propagate on its own
    # eventually, instead of being locked out for a year.
    location ~* \.(png|jpg|jpeg|webp|svg|woff2|ico)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Everything else → Next.js on :3000 ─────────────────────────────────
    # nginx does not match locations top-to-bottom. It finds the longest
    # PREFIX match, then tries the REGEX locations in file order, and a
    # matching regex wins. So the `\.(png|jpg|…)$` block above actually
    # outranks `/_next/static/` and `/splash/` for image files inside them:
    # a fingerprinted `/_next/static/media/logo.a1b2c3.svg` gets `30d`, not
    # `1y immutable`. That is harmless (the URL changes when the file does)
    # but it is not what the block above reads like, so don't "fix" the
    # ordering expecting a behaviour change — to give those prefixes priority
    # you would need `location ^~ /_next/static/`.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 90s;
    }
}
